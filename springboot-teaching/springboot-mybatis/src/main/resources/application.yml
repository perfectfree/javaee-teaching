server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?characterEncoding=utf-8&useSSL=FALSE&allowPublicKeyRetrieval=true
    username: test
    password: 123456  # 请根据实际修改
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always   # 每次启动执行 schema.sql
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: edu.jiangbaiyu.demo.springboot.mybatis.entity
  configuration:
    map-underscore-to-camel-case: true   # 开启驼峰映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志（方便调试）

logging:
  level:
    edu.jiangbaiyu.demo.springboot.mybatis.mapper: debug   # 打印SQL