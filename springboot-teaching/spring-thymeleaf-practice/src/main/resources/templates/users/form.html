<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<head>
    <title th:text="${user.id == null ? '新增用户' : '编辑用户'}">表单页面</title>
</head>
<body>
<section>
    <h2 th:text="${user.id == null ? '新增用户' : '编辑用户'}">表单标题</h2>

    <form th:action="${user.id == null} ? @{/users} : @{/users/{id}(id=${user.id})}"
          th:object="${user}" method="post">
        <!-- 如果是编辑，添加隐藏字段 _method=PUT 模拟PUT -->
        <input type="hidden" name="_method" th:value="${user.id == null} ? 'POST' : 'PUT'" />

        <div style="margin-bottom: 10px;">
            <label>姓名:</label>
            <input type="text" th:field="*{name}" required />
        </div>
        <div style="margin-bottom: 10px;">
            <label>邮箱:</label>
            <input type="email" th:field="*{email}" required />
        </div>
        <div style="margin-bottom: 10px;">
            <label>部门ID:</label>
            <input type="number" th:field="*{deptId}" />
        </div>
        <div style="margin-bottom: 10px;">
            <label>状态:</label>
            <select th:field="*{status}">
                <option value="1">启用</option>
                <option value="0">禁用</option>
            </select>
        </div>
        <button type="submit" class="btn">保存</button>
        <a th:href="@{/users}" class="btn btn-danger">取消</a>
    </form>
</section>
</body>
</html>
