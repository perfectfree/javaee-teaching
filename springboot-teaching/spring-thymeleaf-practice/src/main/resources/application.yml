server:
  port: 8091

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?characterEncoding=utf-8&amp;useSSL=FALSE&amp;allowPublicKeyRetrieval=true
    username: test
    password: 123456  # 请根据实际修改
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always   # 每次启动执行 schema.sql
      schema-locations: classpath:schema.sql
  thymeleaf:
    cache: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true   # 允许使用 _method 参数模拟 PUT/DELETE

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: edu.jiangbaiyu.demo.spring.thymeleaf.practice.entity