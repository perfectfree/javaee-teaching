server:
  port: 8089

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?characterEncoding=utf-8&useSSL=FALSE&allowPublicKeyRetrieval=true
    username: test
    password: 123456  # 请根据实际修改
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always   # 每次启动执行 schema.sql
      schema-locations: classpath:schema.sql
      continue-on-error: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: edu.jiangbaiyu.demo.spring.security.advanced.entity

logging:
  level:
    edu.jiangbaiyu.demo.spring.security.advanced.mapper: debug
    org.springframework.jdbc.datasource.init: DEBUG