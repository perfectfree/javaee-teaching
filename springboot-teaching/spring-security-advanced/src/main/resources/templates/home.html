<!-- home.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="dashboard-container">
    <nav class="glass-nav">
        <div class="nav-brand">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>ModernApp</span>
        </div>
        <div class="nav-user">
            <span class="user-greeting">Welcome, <strong th:text="${username}"></strong></span>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-btn">Sign Out</button>
            </form>
        </div>
    </nav>

    <main class="dashboard-content">
        <div class="welcome-card glass-morphism">
            <h1>Welcome to Your Dashboard</h1>
            <p>You have successfully authenticated with Spring Security.</p>
            <div class="user-info">
                <div class="info-item">
                    <strong>Username:</strong> <span th:text="${username}"></span>
                </div>
                <div class="info-item">
                    <strong>Roles:</strong> <span sec:authentication="principal.authorities"></span>
                </div>
            </div>
        </div>

        <div class="feature-grid">
            <div class="feature-card">
                <div class="feature-icon">🚀</div>
                <h3>Modern UI</h3>
                <p>Glass morphism design with smooth animations</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔒</div>
                <h3>Secure Auth</h3>
                <p>BCrypt encryption & remember-me functionality</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🎨</div>
                <h3>Responsive</h3>
                <p>Perfect on desktop, tablet, and mobile</p>
            </div>
        </div>
    </main>
</div>
</body>
</html>
