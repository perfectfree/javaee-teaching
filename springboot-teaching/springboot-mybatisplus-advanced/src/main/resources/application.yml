spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?characterEncoding=utf-8&amp;useSSL=FALSE&amp;allowPublicKeyRetrieval=true
    username: test
    password: 123456  # 请根据实际修改
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted  # 全局逻辑删除字段名
      logic-delete-value: 1        # 已删除值
      logic-not-delete-value: 0    # 未删除值