server:
  port: 8841
spring:
  application:
    name: auth-service
  profiles:
    active: dev
  cloud:
    # Nacos配置
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        enabled: true
      config:
        namespace: ${spring.profiles.active:public}
        enabled: false
        auto-refresh: true
        enable-remote-sync-config: true
    sentinel:
      transport:
        dashboard: localhost:8080
  jackson:
    time-zone: GMT+8

feign:
  client:
    config:
      default:
        logger-level: full
        connect-timeout: 5000
        read-timeout: 5000

jwt:
  secret: mySecretKeyForJWTGeneration12345678901234567890
  expiration: 3600000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

#logging:
#  level:
#    com.alibaba.cloud.nacos: DEBUG
#    org.springframework.cloud: DEBUG

---
spring:
    activate:
      on-profile: dev
    datasource:
      url: jdbc:mysql://localhost:3306/ms_order?characterEncoding=utf-8&useSSL=FALSE&allowPublicKeyRetrieval=true
      username: test
      password: 123456  # 请根据实际修改
      driver-class-name: com.mysql.cj.jdbc.Driver
